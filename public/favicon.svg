<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <clipPath id="circle">
      <circle cx="16" cy="16" r="14"/>
    </clipPath>
  </defs>
  <!-- Background circle -->
  <circle cx="16" cy="16" r="14" fill="#0d4f5c"/>
  <!-- Stylised "R" letterform in white, bold serif -->
  <text
    x="16"
    y="22"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="20"
    font-weight="700"
    fill="#ffffff"
    clip-path="url(#circle)"
  >R</text>
  <!-- Small caduceus dot / medical cross accent at bottom -->
  <circle cx="16" cy="28.5" r="1.2" fill="#7ec8d8" opacity="0.85"/>
</svg>
